<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DISCHAT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scanlines"></div>
    <div id="toast-bin"></div>

    <!-- Hidden Audio for Notifications -->
    <audio id="notification-sound" preload="auto">
        <source src="\notificaion\notification.mp3" type="audio/mpeg">
    </audio>

    <!-- AUTH LAYER -->
    <div id="auth-layer" class="gate-wrapper">
        <div class="gate-panel">
            <div class="glitch-title">DISCHAT_OS</div>
            <div style="text-align:center; margin-bottom:1.5rem; color:#00f2ff; font-size:0.9rem; letter-spacing:2px;">
                NEURAL LINK ESTABLISHED
            </div>
            
            <input id="l-u" class="gate-input" placeholder="IDENTITY_ID" spellcheck="false" autocomplete="off">
            <input id="l-p" class="gate-input" type="password" placeholder="PASSKEY">
            
            <button class="gate-btn" onclick="auth('login')">INITIALIZE_LINK</button>
            <button class="gate-btn outline" style="font-size:0.9rem; padding:0.8rem;" onclick="auth('register')">
                REGISTER_NEW_ID
            </button>
            
            <p id="auth-msg" style="text-align:center; margin-top:1.5rem; font-size:0.85rem; min-height:1.2em;"></p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app" class="terminal-grid" style="display:none">
        <aside id="sidebar" class="sidebar">
            <div style="padding:1.5rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
                <div class="avatar-round" id="nav-avatar" onclick="openProfile('me')">?</div>
                <button class="gate-btn outline mobile-only" style="width:50px; padding:0.5rem;" onclick="toggleSide()">[X]</button>
            </div>

            <div style="padding:1rem; position:relative; border-bottom:1px solid var(--border);">
                <input id="net-search" placeholder="SEARCH_NET..." oninput="handleSearch()" class="gate-input" style="margin:0;">
                <div id="search-drop" class="search-results"></div>
            </div>

            <div class="sidebar-scroll" style="flex:1; overflow-y:auto; overflow-x:hidden;">
                <div style="color:var(--neon); padding:1rem 1.5rem 0.5rem; font-size:0.8rem; opacity:0.6;">_GLOBAL</div>
                <div class="nav-item" onclick="joinRoom('global', 'GLOBAL CHAT')">[#] GLOBAL CHAT</div>
                
                <div style="display:flex; justify-content:space-between; padding:1.5rem 1.5rem 0.5rem; color:var(--neon); font-size:0.8rem; opacity:0.6;">
                    <span>_CLUSTERS</span>
                    <span onclick="openCreateGroupModal()" style="cursor:pointer; font-weight:bold; padding: 0 5px;">[+]</span>
                </div>
                <div id="cluster-list"></div>

                <div style="color:var(--neon); padding:1.5rem 1.5rem 0.5rem; font-size:0.8rem; opacity:0.6;">_DIRECT_PEERS</div>
                <div id="dm-list"></div>
            </div>
        </aside>

        <main class="viewport">
            <header class="view-header">
                <div class="hamburger mobile-only" onclick="toggleSide()">
                    <span></span><span></span><span></span>
                </div>
                <div onclick="openProfile('room')" style="cursor:pointer; font-size:1.2rem; font-weight:bold; flex:1;">
                    <span style="color:var(--neon)">?</span> 
                    <span id="active-room">STANDBY</span>
                </div>
            </header>

            <div id="msg-flow" class="chat-flow"></div>

            <footer class="input-bay">
                <div class="input-box">
                    <input id="m-in" placeholder="DATA_TRANSMIT..." autocomplete="off" 
                           onkeypress="if(event.key === 'Enter') sendMsg()">
                    <button class="gate-btn" style="width:140px; margin:0;" onclick="sendMsg()">
                        TRANSMIT
                    </button>
                </div>
            </footer>
        </main>
    </div>

    <!-- MODAL -->
    <div id="modal-bg" class="modal-bg" onclick="closeModal(event)">
        <div id="modal-box" class="gate-panel" onclick="event.stopImmediatePropagation()"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
